# The six headers from deploy/HEADERS.md. Included wherever add_header appears: nginx drops inherited
# add_header directives in any block that declares its own, so every such block re-includes this file.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Each page carries a hashed script/style CSP in a <meta> tag (Astro + scripts/csp.mjs).
# This header adds the one directive <meta> can't express.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
