# oarlock.sh static site; implements deploy/HEADERS.md. TLS, http -> https and www -> apex live at the
# cluster gateway (qopsc/stacks), not here. Proven by tests/image.sh.

# HTML (pages, directory indexes, the 404 page) is served no-cache; other types get no Cache-Control here.
map $sent_http_content_type $html_cache_control {
    "~^text/html" "no-cache";
    default "";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json text/plain;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $html_cache_control always;

    # The installer: no extension, so default_type sets its type; no-cache so fixes reach users at once.
    location = /install {
        default_type text/plain;
        charset utf-8;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fingerprinted build assets never change under the same name.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # No try_files: the static handler 301s /docs to /docs/ (relative Location) and serves index.html.
    error_page 404 /404.html;
}
