name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build (astro check, build, CSP finalize)
        run: bun run build
      - name: Verify every inline script and style is covered by the CSP
        run: bun run check:csp
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck public/install tests/install.test.sh
      - name: Installer tests
        run: bash tests/install.test.sh
      - name: Dry run on this runner
        run: bash public/install --dry-run
